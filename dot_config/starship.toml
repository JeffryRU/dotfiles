"$schema" = 'https://starship.rs/config-schema.json'

# ~/.config/starship.toml
#
# Prompt minimalista de dos líneas. La primera da contexto (dónde estoy, en qué
# rama, con qué runtime); la segunda es sólo para escribir.
#
#   ~/GitHub/dotfiles  main !2 ?1                          3s  14:32
#   ❯
#
# ── Por qué no hay paleta de hex aquí ────────────────────────────────────
# Los estilos usan NOMBRES ANSI (blue, purple, bright-black…), no hex. Así el
# prompt hereda los 16 colores que define la terminal en
# dot_config/wezterm/colors.lua, y con eso:
#
#   · Cambiar de tema es tocar UN sitio, no tres.
#   · Al alternar claro/oscuro el prompt sigue solo.
#   · En una terminal ajena (SSH, VS Code, CI) el prompt adopta SU paleta en
#     vez de imponer unos hex que quizá no se lean sobre ese fondo.
#
# Es la recomendación habitual para prompts que viajan entre máquinas.

add_newline = true
command_timeout = 1000
scan_timeout = 30

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$php\
$nodejs\
$python\
$golang\
$rust\
$java\
$docker_context\
$cmd_duration\
$time\
$line_break\
$character"""

# ── Línea 1: contexto ────────────────────────────────────────────────────

[directory]
style = 'bold blue'
format = '[$path]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
home_symbol = '~'
use_os_path_sep = false   # '/' también en Windows: se lee más limpio
read_only = ' '
read_only_style = 'red'

[git_branch]
symbol = ' '
format = '[$symbol$branch]($style) '
style = 'purple'
truncation_length = 24
truncation_symbol = '…'

[git_status]
style = 'yellow'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ''
untracked = '?${count}'
stashed = '\$${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[git_state]
style = 'bright-yellow'
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# Empuja lo secundario al borde derecho de la ventana.
[fill]
symbol = ' '
style = 'bright-black'

# ── Runtimes: sólo aparecen en proyectos que los usan ────────────────────

[php]
symbol = ' '
style = 'purple'
format = '[$symbol($version )]($style)'

[nodejs]
symbol = ' '
style = 'green'
format = '[$symbol($version )]($style)'
detect_files = ['package.json', '.node-version', '.nvmrc']

[python]
symbol = ' '
style = 'yellow'
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[golang]
symbol = ' '
style = 'cyan'
format = '[$symbol($version )]($style)'

[rust]
symbol = ' '
style = 'red'
format = '[$symbol($version )]($style)'

[java]
symbol = ' '
style = 'red'
format = '[$symbol($version )]($style)'

[docker_context]
symbol = ' '
style = 'blue'
format = '[$symbol$context]($style) '
only_with_files = true

# ── Secundario: coste y hora ─────────────────────────────────────────────

[cmd_duration]
min_time = 2_000
format = '[ $duration]($style) '
style = 'bright-black'
show_milliseconds = false

[time]
disabled = false
format = '[$time]($style)'
time_format = '%H:%M'
style = 'bright-black'

# ── Línea 2: sólo el cursor ──────────────────────────────────────────────

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](cyan)'

# ── Ruido apagado ────────────────────────────────────────────────────────
# Un prompt minimalista se define sobre todo por lo que decide no mostrar.

[package]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[battery]
disabled = true

[memory_usage]
disabled = true

[status]
disabled = true
